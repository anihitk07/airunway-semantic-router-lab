apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: __AGENTGATEWAY_BACKEND_NAME__
  namespace: __BACKEND_NAMESPACE__
spec:
  ai:
    provider:
      openai: {}
      host: __BACKEND_HOST__
      port: __BACKEND_PORT__
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: __AGENTGATEWAY_BACKEND_NAME__
  namespace: __ROUTE_NAMESPACE__
spec:
  parentRefs:
  - name: __AGENTGATEWAY_GATEWAY_NAME__
    namespace: __GATEWAY_NAMESPACE__
  rules:
  - backendRefs:
    - name: __AGENTGATEWAY_BACKEND_NAME__
      namespace: __BACKEND_NAMESPACE__
      group: agentgateway.dev
      kind: AgentgatewayBackend
